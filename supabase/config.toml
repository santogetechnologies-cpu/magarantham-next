project_id = "magarantham-silks"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?next=/reset-password"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
# Keep the Email provider available for sign-in, confirmation resend and password recovery.
# The global signup flag above and the hook below block unmanaged account creation.
enable_signup = true
enable_confirmations = true
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/reject_public_signup"
